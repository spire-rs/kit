# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "robotxt"
version = "0.6.2"
readme = "./README.md"

edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

repository = "https://github.com/spire-rs/kit"
homepage = "https://github.com/spire-rs/kit"
documentation = "https://docs.rs/robotxt"
categories = ["asynchronous", "web-programming"]
keywords = ["robots", "robot", "exclusion", "crawler", "scraper"]
description = """
The implementation of the Robots.txt (or URL exclusion) protocol with
the support of crawl-delay, sitemap and universal match extensions.
"""

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
path = "./lib.rs"

[features]
default = [
    "builder",
    "parser"
]

full = [
    "builder",
    "parser",
    "optimal",
    "serde"
]

builder = []
parser = ["dep:nom", "dep:bstr", "dep:regex"]
optimal = []
serde = ["dep:serde", "url/serde", "serde/derive", "serde/rc"]

[dependencies]
url = { version = "2.5" }
thiserror = { version = "1.0" }
percent-encoding = { version = "2.3" }

nom = { version = "7.1", optional = true }
bstr = { version = "1.9", optional = true }
regex = { version = "1.10", optional = true }
serde = { version = "1.0", optional = true }

[dev-dependencies]
serde_json = { version = "1.0" }
