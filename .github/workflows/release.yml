name: Release

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to publish"
        required: true
        type: choice
        options:
          - robotxt
          - sitemapo

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish ${{ inputs.crate }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Get version
        id: version
        run: echo "VERSION=$(cargo pkgid -p ${{ inputs.crate }} | sed 's/.*[#@]//')" >> $GITHUB_OUTPUT

      - name: Publish
        run: cargo publish -p ${{ inputs.crate }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

      - name: Create release
        run: |
          gh release create ${{ inputs.crate }}-v${{ steps.version.outputs.VERSION }} \
            --title "${{ inputs.crate }} v${{ steps.version.outputs.VERSION }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
